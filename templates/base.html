<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Unravel Service{% endblock %}</title>
  <link rel="icon" href="/assets/icons/icon-solo.svg" type="image/svg+xml">

  <!-- Bootswatch Lumen (Self-Contained Local Assets with CDN Fallback) -->
  <link rel="stylesheet" id="bootswatch-theme-css" href="/assets/vendor/bootswatch/lumen/bootstrap.min.css" onerror="this.onerror=null;this.href='/assets/vendor/bootstrap/bootstrap.min.css';">
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css';">
  <link rel="stylesheet" href="/assets/vendor/sweetalert2/sweetalert2.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css';">

  <style>
    :root {
      --unravel-primary: #158cba;
      --unravel-primary-dark: #117095;
      --unravel-surface: #f8fafc;
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-shadow: 0 4px 20px rgba(0, 48, 135, 0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: #334155;
    }
    .navbar-unravel {
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .ribbon-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: #1e293b;
      letter-spacing: -0.01em;
    }
    .ribbon-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #158cba 0%, #117095 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      box-shadow: 0 2px 6px rgba(21, 140, 186, 0.3);
    }
    .card-custom {
      background: #ffffff;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-custom:hover {
      box-shadow: 0 8px 24px rgba(0, 48, 135, 0.09);
    }
    .stat-val {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .table td, .table th {
      vertical-align: middle;
      font-size: 0.85rem;
    }
    .nav-tabs .nav-link {
      font-weight: 600;
      font-size: 0.88rem;
      color: #64748b;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1rem;
    }
    .nav-tabs .nav-link.active {
      color: #158cba;
      border-bottom: 2px solid #158cba;
      background: transparent;
    }
    .badge-soft-primary { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-soft-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .badge-soft-warning { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
    .badge-soft-danger  { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .badge-soft-info    { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }
    .badge-soft-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    footer.service-footer {
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      font-size: 0.8rem;
      color: #64748b;
      padding: 0.75rem 1.5rem;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-unravel sticky-top px-3">
    <div class="container-fluid">
      <a class="ribbon-brand text-decoration-none" href="/">
        <span class=""><img src="assets/icons/icon.svg" style="    max-height: 35px;" alt=""></span>
        <span>Unravel</span>
        <span class="badge bg-light text-muted border fw-normal ms-1" style="font-size:0.75rem;">Microservice</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#serviceNavbar" aria-controls="serviceNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="serviceNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'status' %}active fw-semibold text-primary{% endif %}" href="/">
              <i class="bi bi-activity me-1"></i>Status
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'admin' %}active fw-semibold text-primary{% endif %}" href="/admin">
              <i class="bi bi-speedometer2 me-1"></i>Admin
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/docs" target="_blank">
              <i class="bi bi-journal-code me-1"></i>Swagger API
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          {% block navbar_actions %}{% endblock %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Service Footer -->
  <footer class="service-footer mt-auto d-flex flex-wrap align-items-center justify-content-between">
    <div>
      <i class="bi bi-shield-check text-success me-1"></i>
      <strong>Unravel Service</strong> &bull; Zero-Trust Tabular Gateway & Decryption Platform
    </div>
    <div class="text-muted">
      Theme: <span class="badge bg-secondary-subtle text-secondary border font-monospace">Lumen</span>
    </div>
  </footer>

  <!-- Scripts (Self-Contained Local Vendor Scripts with CDN Fallback) -->
  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js';"></script>
  <script src="/assets/vendor/sweetalert2/sweetalert2.all.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/sweetalert2@11';"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
